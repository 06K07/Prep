services:
  app:
    build: .
    ports:
      - '127.0.0.1:3000:3000'
    environment:
      - GEMINI_API_KEY
      - ANTHROPIC_API_KEY
      - MAX_CONCURRENT_RUNS=2
    # Hardening: user submitted C++ runs in this container.
    read_only: true
    tmpfs:
      - /tmp:size=256m,exec
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    pids_limit: 256
    mem_limit: 2g
    cpus: 2
    restart: unless-stopped
